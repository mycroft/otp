name: Audit

# Checks Cargo.lock against the RustSec advisory database. Advisories are published
# after a release, so a lockfile that passed yesterday can fail today: hence the daily run.
on:
  schedule:
    - cron: "17 5 * * *"
  push:
    branches: [main]
    paths: ["**/Cargo.toml", "Cargo.lock", ".github/workflows/audit.yml"]
  pull_request:
    paths: ["**/Cargo.toml", "Cargo.lock", ".github/workflows/audit.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # A prebuilt cargo-audit, instead of compiling it on every run.
      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-audit@0.22.2
      # Fails on vulnerabilities; unmaintained or yanked crates are reported as warnings.
      - run: cargo audit
